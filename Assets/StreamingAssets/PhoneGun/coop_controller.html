<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>お札スライド</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05060a;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }

  #app {
    position: fixed;
    inset: 0;
  }

  /* ---------- スタート画面 ---------- */
  #startScreen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
    text-align: center;
    background: radial-gradient(circle at 50% 30%, #241a1a 0%, #05060a 70%);
  }
  #startScreen h1 {
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: 2px;
  }
  #titleLogo {
    width: 240px;
    height: auto;
    margin: 0 0 4px;
  }
  #startScreen p {
    font-size: 20px;
    color: #ce4747;
    line-height: 1.6;
    margin: 0;
  }
  #startInstruction {
    font-size: 26px;
    font-weight: bold;
    color: #fc4848;
    line-height: 1.5;
  }
  #startBtn {
    margin-top: 12px;
    padding: 18px 48px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, #e0483f, #a01f1f);
    color: #fff;
    box-shadow: 0 8px 20px rgba(160, 31, 31, 0.45);
    letter-spacing: 4px;
  }
  #startBtn:active {
    transform: scale(0.97);
  }
  #startError {
    color: #ff7676;
    font-size: 13px;
    min-height: 18px;
  }

  /* ---------- ゲーム画面 ---------- */
  #gameScreen {
    position: absolute;
    inset: 0;
    display: none;
  }
  #gameScreen.active {
    display: block;
  }

  #topBar {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    z-index: 10;
    font-size: 13px;
    color: #9aa4b2;
  }
  #statusDot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff4757;
    margin-right: 6px;
    vertical-align: middle;
  }
  #statusDot.connected {
    background: #2ed573;
  }
  #scoreLabel {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
  }
  #recenterBtn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    color: #eee;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
  }

  #hint {
    position: absolute;
    bottom: 26%;
    left: 0; right: 0;
    text-align: center;
    color: #6b7480;
    font-size: 13px;
    pointer-events: none;
    letter-spacing: 1px;
  }

  #debugInfo {
    position: absolute;
    bottom: 20%;
    left: 0; right: 0;
    text-align: center;
    color: #4a5560;
    font-size: 12px;
    pointer-events: none;
    font-family: monospace;
  }
  #sensorWarning {
    position: absolute;
    bottom: 14%;
    left: 16px; right: 16px;
    text-align: center;
    color: #ffcf6b;
    font-size: 12px;
    line-height: 1.5;
    pointer-events: none;
  }

    align-items: flex-end;
    justify-content: center;
    padding-bottom: 20px;
  }
  #slideTrack {
    position: relative;
    width: 160px;
    height: 260px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  #slideHint {
    position: absolute;
    top: -76px;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  #slideArrow {
    display: inline-block;
    font-size: 42px;
    font-weight: bold;
    line-height: 1;
    color: rgba(255,255,255,0.65);
    animation: slideArrowBounce 1s ease-in-out infinite;
  }
  @keyframes slideArrowBounce {
    0%, 100% { transform: translateY(0); opacity: 0.5; }
    50% { transform: translateY(-16px); opacity: 1; }
  }
  #ofudaHandle {
    position: absolute;
    bottom: 0;
    touch-action: none;
    will-change: transform;
  }
  #ofudaHandle.dragging {
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.35));
  }

  /* 投擲演出(スライドエリアから照準へ飛んでいくお札) */
  #flyingOfuda {
    position: absolute;
    left: 50%;
    top: 50%;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  #flyingOfuda.show {
    animation: throwAnim 0.5s cubic-bezier(.25, .65, .3, 1) forwards;
  }
  @keyframes throwAnim {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 58vh)) scale(0.55); }
  }
</style>
</head>

    // レティクルがずれる。実際の傾きを受信するまでは送信を待つ。
    if (!playerId || !hasReceivedOrientation) return;
    // センサー値が届き始めてからRECENTER_WINDOW_MSの間は、まだ構えている最中の
    // 可能性があるので毎回キャリブレーションし続け、構え終わった頃の向きを
    // 最終的な基準点にする（＝始めるボタンを押した直後は照準リセットが効き続ける）
    var inRecenterWindow = (Date.now() - firstOrientationTime) < RECENTER_WINDOW_MS;
    var payload = {
      id: playerId,
      alpha: latestOrientation.alpha,
      beta: latestOrientation.beta,
      gamma: latestOrientation.gamma,
      recenter: pendingRecenter || inRecenterWindow,
    };
    pendingRecenter = false;

    fetch(API_BASE + "/aim", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, NGROK_SKIP_HEADERS),
      body: JSON.stringify(payload),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && typeof data.score === "number") {
          if (data.score > lastKnownScore && navigator.vibrate) {
            navigator.vibrate([40, 30, 40]); // お化けに命中した時の振動
          }
          lastKnownScore = data.score;
          scoreLabel.textContent = data.score + "点";
        }
      })
      .catch(function () { /* 通信瞬断は無視して次回送信に任せる */ });
  }

  function clientYOf(e) {
    if (e.touches && e.touches.length) return e.touches[0].clientY;
    if (e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
    return e.clientY;
  }

  function onDragStart(e) {
    if (!playerId) return;
    dragging = true;
    dragStartY = clientYOf(e);
    dragDistance = 0;
    ofudaHandle.classList.add("dragging");
  }

  function onDragMove(e) {
    if (!dragging) return;
    var delta = dragStartY - clientYOf(e); // 上方向が正
    dragDistance = Math.max(0, Math.min(DRAG_RANGE, delta));
    ofudaHandle.style.transform = "translateY(-" + dragDistance + "px)";
    slideHintEl.style.opacity = String(Math.max(0, 1 - dragDistance / DRAG_RANGE));
  }

  function onDragEnd() {
    if (!dragging) return;
    dragging = false;
    ofudaHandle.classList.remove("dragging");

    if (dragDistance >= DRAG_THRESHOLD) {
      onThrow();
    }
    resetHandle();
    dragDistance = 0;
  }

  function resetHandle() {
    ofudaHandle.style.transition = "transform 0.1s ease-out";
    ofudaHandle.style.transform = "translateY(0)";
    slideHintEl.style.opacity = "1";
    setTimeout(function () { ofudaHandle.style.transition = ""; }, 110);
  }

  function onThrow() {
    if (!playerId) return;

    playThrowEffect();
    playThrowSound();
    if (navigator.vibrate) navigator.vibrate(35);

    fetch(API_BASE + "/fire", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, NGROK_SKIP_HEADERS),
      body: JSON.stringify({ id: playerId }),
    }).catch(function () { /* ignore */ });
  }

  function playThrowEffect() {
    flyingOfudaEl.classList.remove("show");
    // reflowで再トリガー
    void flyingOfudaEl.offsetWidth;
    flyingOfudaEl.classList.add("show");
  }

  function unlockAudio() {
    try {
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioCtor();
    } catch (err) {
      audioCtx = null;
    }
  }

  // 投げた瞬間に、このスマホ端末でTHROW_SOUND_DATA_URIの音を鳴らす
  function playThrowSound() {
    try {
      var a = new Audio(THROW_SOUND_DATA_URI);
      a.play().catch(function () { /* 自動再生がブロックされた場合は無視 */ });
    } catch (err) { /* ignore */ }
  }
})();
</script>
</body>
</html>
