<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマホ手裏剣 接続用QR</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05060a;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 32px;
    text-align: center;
    box-sizing: border-box;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 2px;
    color: #9aa4b2;
  }
  #qrBox {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  #qrBox img {
    display: block;
    width: min(60vw, 420px);
    height: min(60vw, 420px);
    image-rendering: pixelated;
  }
  #url {
    font-size: 20px;
    font-weight: bold;
    word-break: break-all;
    color: #fff;
  }
  #status {
    font-size: 13px;
    color: #6b7480;
  }
  #status.connected {
    color: #2ed573;
  }
</style>
</head>
<body>
<div id="app">
  <h1>🥷 スマホ手裏剣に参加する</h1>
  <div id="qrBox"><img id="qrImg" src="/qr.png" alt="QRコード"></div>
  <div id="url">接続先を取得中...</div>
  <div id="status">サーバー確認中...</div>
</div>

<script>
(function () {
  "use strict";

  var urlEl = document.getElementById("url");
  var statusEl = document.getElementById("status");
  var qrImgEl = document.getElementById("qrImg");

  function refresh() {
    fetch("/status")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.url) {
          urlEl.textContent = data.url;
        }
        if (data.running) {
          statusEl.textContent = "サーバー稼働中";
          statusEl.classList.add("connected");
        } else {
          statusEl.textContent = "サーバー起動中...";
          statusEl.classList.remove("connected");
        }
        // QR画像もURLが変わっている可能性があるので、キャッシュを避けて再取得する
        qrImgEl.src = "/qr.png?t=" + Date.now();
      })
      .catch(function () {
        statusEl.textContent = "サーバーに接続できません";
        statusEl.classList.remove("connected");
      });
  }

  refresh();
  setInterval(refresh, 3000);
})();
</script>
</body>
</html>
